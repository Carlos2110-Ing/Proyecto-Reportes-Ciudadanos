spring.application.name=reportes-ciudadanos

# Puerto del servidor
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.datasource.url=jdbc:mysql://localhost:3306/reportesciudadanos_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Carlos2110!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.com.utp.reportes_ciudadanos=DEBUG

# HikariCP \u2013 pool de conexiones
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=-1

app.db.path=src/main/resources/data/db.json

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=TRACE
