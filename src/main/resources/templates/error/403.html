<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-auth}"
      lang="es">
    <head>
        <title>Acceso Denegado</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <div class="auth-logo-icon" style="background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.3);">
                            <i class="bi bi-shield-lock-fill" style="color:#ef4444;"></i>
                        </div>
                        <div class="auth-brand-title">403</div>
                        <div class="auth-brand-sub">Acceso Denegado</div>
                    </div>
                    <div class="auth-card-body text-center">
                        <p class="auth-desc" th:text="${mensaje}">No tienes permiso para acceder a este recurso.</p>
                        <a th:href="@{/dashboard}" class="btn-primary-custom" style="display:inline-block; width:auto; padding:0.7rem 2rem;">
                            <i class="bi bi-house me-2"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
