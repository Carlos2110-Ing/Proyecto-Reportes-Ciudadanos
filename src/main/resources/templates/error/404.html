<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-auth}"
      lang="es">
    <head>
        <title>Página no encontrada</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <div class="auth-logo-icon">
                            <i class="bi bi-map" style="color:var(--teal);"></i>
                        </div>
                        <div class="auth-brand-title">404</div>
                        <div class="auth-brand-sub">Página no encontrada</div>
                    </div>
                    <div class="auth-card-body text-center">
                        <p class="auth-desc" th:text="${mensaje}">La página que buscas no existe.</p>
                        <a th:href="@{/dashboard}" class="btn-primary-custom" style="display:inline-block; width:auto; padding:0.7rem 2rem;">
                            <i class="bi bi-house me-2"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
