!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-auth}"
      lang="es">
    <head>
        <title>Error inesperado</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-card-header">
                        <div class="auth-logo-icon" style="background:rgba(148,163,184,0.15); border-color:rgba(148,163,184,0.3);">
                            <i class="bi bi-bug-fill" style="color:#94a3b8;"></i>
                        </div>
                        <div class="auth-brand-title" th:text="'Error ' + ${status}">Error</div>
                        <div class="auth-brand-sub">Algo salió mal</div>
                    </div>
                    <div class="auth-card-body text-center">
                        <p class="auth-desc" th:text="${mensaje}">Ocurrió un error inesperado.</p>
                        <a th:href="@{/dashboard}" class="btn-primary-custom" style="display:inline-block; width:auto; padding:0.7rem 2rem;">
                            <i class="bi bi-house me-2"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
