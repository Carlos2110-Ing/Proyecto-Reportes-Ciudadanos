<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
lang="es">
    <body>

        <!-- ═══════════════════════════════════════════════════════
             FRAGMENT: navbar-user  →  th:replace="~{fragments/navbar :: navbar-user(activePage='dashboard')}"
             activePage values: dashboard | nuevo-reporte | mis-reportes | acerca-de | perfil
             ═══════════════════════════════════════════════════════ -->
        <nav th:fragment="navbar-user(activePage)"
             class="navbar navbar-expand-lg navbar-safeperu">
            <div class="container">

                <a class="navbar-brand-custom" th:href="@{/dashboard}">
                    <i class="fa-solid fa-city"></i>SafePeru
                </a>

                <button class="navbar-toggler border-0" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navMain"
                        style="color:#fff;">
                    <i class="bi bi-list" style="font-size:1.5rem;"></i>
                </button>

                <div class="collapse navbar-collapse" id="navMain">
                    <ul class="navbar-nav mx-auto gap-1">
                        <li class="nav-item">
                            <a class="nav-link-custom"
                               th:classappend="${activePage == 'dashboard'} ? 'active'"
                               th:href="@{/dashboard}">
                                <i class="bi bi-house me-1"></i>Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-custom"
                               th:classappend="${activePage == 'nuevo-reporte'} ? 'active'"
                               th:href="@{/reportes/nuevo}">
                                <i class="bi bi-plus-circle me-1"></i>Reportar
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-custom"
                               th:classappend="${activePage == 'mis-reportes'} ? 'active'"
                               th:href="@{/reportes/mis-reportes}">
                                <i class="bi bi-clipboard me-1"></i>Mis Reportes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-custom"
                               th:classappend="${activePage == 'acerca-de'} ? 'active'"
                               th:href="@{/acerca-de}">
                                <i class="bi bi-info-circle me-1"></i>Acerca de
                            </a>
                        </li>
                        <!-- Solo visible para ADMIN: enlace directo al panel -->
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link-custom" th:href="@{/admin}">
                                <i class="bi bi-shield-fill me-1"></i>Panel Admin
                            </a>
                        </li>
                    </ul>

                    <!-- Dropdown usuario -->
                    <div class="dropdown">
                        <div class="user-badge dropdown-toggle" data-bs-toggle="dropdown">
                            <div class="user-avatar" sec:authentication="principal.avatarInicial">JD</div>
                            <span sec:authentication="principal.nombreCompleto">Usuario</span>
                            <!-- Insignia verificado: visible solo si el atributo verificado está en sesión -->
                            <!-- Como ahora Spring Security gestiona la sesión, usamos un atributo del modelo -->
                            <span class="verified-badge-nav" th:if="${verificado}">
                                <i class="bi bi-check2"></i> Verificado
                            </span>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end rounded-3 border-0 shadow-sm mt-2">
                            <li>
                                <a class="dropdown-item" th:href="@{/perfil}">
                                    <i class="bi bi-person me-2 text-muted"></i>Ver Perfil
                                </a>
                            </li>
                            <!-- Solo para ADMIN -->
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" th:href="@{/admin}">
                                    <i class="bi bi-shield me-2 text-muted"></i>Panel Admin
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <!-- Logout con POST (requerido por Spring Security CSRF) -->
                            <li>
                                <form th:action="@{/logout}" method="post" style="display:inline;">
                                    <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </nav>

        <!-- ═══════════════════════════════════════════════════════
             FRAGMENT: navbar-auth  →  th:replace="~{fragments/navbar :: navbar-auth}"
             Para páginas de login y registro (sin menú de usuario)
             ═══════════════════════════════════════════════════════ -->
        <nav th:fragment="navbar-auth" class="navbar navbar-safeperu">
            <div class="container justify-content-center">
                <a class="navbar-brand-custom" th:href="@{/}">
                    <i class="fa-solid fa-city"></i>SafePeru
                </a>
            </div>
        </nav>

    </body>
</html>
