<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base-auth}" lang="es">

<head>
  <title>Bienvenido</title>
</head>

<body>

  <div layout:fragment="content">
    <div class="auth-wrapper">
      <div class="auth-card">

        <!-- Cabecera -->
        <div class="auth-card-header">
          <div class="auth-logo-icon auth-logo-icon-lg">
            <i class="fa-solid fa-city"></i>
          </div>
          <div class="auth-brand-title">SafePeru</div>
          <div class="auth-brand-sub">Sistema de Reportes Ciudadanos</div>
        </div>

        <!-- Cuerpo -->
        <div class="auth-card-body">
          <div class="text-center">
            <span class="badge-tag"><i class="bi bi-shield-check me-1"></i>Plataforma Oficial</span>
          </div>
          <p class="auth-desc text-center">
            Reporta incidentes, emergencias y situaciones de riesgo en tu comunidad de forma rápida, segura y confiable.
          </p>
          <a th:href="@{/login}" class="btn-primary-custom auth-action-btn mb-3">
            <i class="fa-solid fa-right-to-bracket btn-icon me-2"></i><span class="btn-text">Iniciar Sesión</span>
          </a>
          <a th:href="@{/registro}" class="btn-outline-teal auth-action-btn">
            <i class="fa-solid fa-user-plus btn-icon me-2"></i><span class="btn-text">Crear Cuenta</span>
          </a>
          <p class="footer-note">Al continuar aceptas nuestros Términos y Política de Privacidad.</p>
        </div>

      </div>
    </div>
  </div>

  <th:block layout:fragment="scripts-extra">
    <script>
      document.querySelectorAll('.auth-action-btn').forEach(button => {
        button.addEventListener('click', function (event) {
          // Evita que el enlace cambie de página inmediatamente 
          event.preventDefault();
          // Evita hacer clic varias veces durante la animación 
          if (this.classList.contains('is-clicked')) {
            return;
          }
          this.classList.add('is-clicked');
          // Esperamos a que termine la animación 
          setTimeout(() => {
              window.location.href = this.href;
            },
            450);
        });
      });
    </script>
  </th:block>

</body>

</html>
