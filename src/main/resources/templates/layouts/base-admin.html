<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title layout:title-pattern="$CONTENT_TITLE – SafePeru Admin">SafePeru Admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/safeperu.css}" rel="stylesheet" />

  <th:block layout:fragment="head-extra"></th:block>
</head>
<body class="admin-body">

  <!-- ════ SIDEBAR ════ -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <i class="fa-solid fa-city"></i>
      <div>
        <span>SafePeru</span>
        <small>Panel Administrador</small>
      </div>
    </div>

    <div class="sidebar-section">Principal</div>
    <a th:href="@{/admin}"     class="sidebar-link active"><i class="bi bi-grid-fill"></i>Dashboard</a>

    <div class="sidebar-section">Gestión</div>
    <a href="#usuarios"        class="sidebar-link"><i class="bi bi-people-fill"></i>Usuarios</a>
    <a href="#reportes"        class="sidebar-link"><i class="bi bi-flag-fill"></i>Reportes</a>

    <div class="sidebar-section">Sistema</div>
    <a th:href="@{/dashboard}" class="sidebar-link"><i class="bi bi-arrow-left-circle"></i>Vista Ciudadana</a>
    <a th:href="@{/logout}"    class="sidebar-link"><i class="bi bi-box-arrow-left"></i>Cerrar Sesión</a>
  </aside>

  <!-- ════ ÁREA PRINCIPAL ════ -->
  <div class="admin-main">

    <!-- Topbar -->
    <div class="admin-topbar">
      <span class="topbar-title" layout:fragment="page-title">Panel de Administración</span>
      <span class="admin-badge"><i class="bi bi-shield-fill"></i>Administrador</span>
    </div>

    <!-- Contenido -->
    <div class="container-fluid p-4">

      <!-- Flash messages -->
      <div th:if="${exito}" class="alert-exito mb-3">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${exito}"></span>
      </div>
      <div th:if="${error}" class="alert-error mb-3">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- SLOT: contenido específico de cada página admin -->
      <div layout:fragment="content"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <th:block layout:fragment="scripts-extra"></th:block>

</body>
</html>
