<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Título dinámico: cada página lo sobreescribe -->
        <title layout:title-pattern="$CONTENT_TITLE – SafePeru">SafePeru</title>

        <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link th:href="@{/css/safeperu.css}" rel="stylesheet" />

        <!-- Slot: cada página puede agregar sus propios scripts/links en el head -->
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

    <!--
      SLOT PRINCIPAL: cada página inyecta su contenido aquí.
    -->
    <div layout:fragment="content"></div>

    <!-- Scripts base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Validación Bootstrap reutilizable -->
    <script>
        (() => {
            'use strict';
            document.querySelectorAll('.needs-validation').forEach(form => {
                form.addEventListener('submit', e => {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });
        })();
    </script>

    <!-- Slot: scripts adicionales por página -->
<th:block layout:fragment="scripts-extra"></th:block>

</body>
</html>
