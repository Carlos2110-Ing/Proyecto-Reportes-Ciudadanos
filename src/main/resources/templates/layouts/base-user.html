<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title layout:title-pattern="$CONTENT_TITLE – SafePeru">SafePeru</title>

        <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

        <!-- Slot: páginas que necesitan Leaflet u otros CSS lo declaran aquí -->
    <th:block layout:fragment="head-extra"></th:block>

    <link th:href="@{/css/safeperu.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ════ NAVBAR (fragmento compartido) ════ -->
    <div th:replace="~{fragments/navbar :: navbar-user(activePage=~{::activePageValue})}">
        <!--
          Cada página define el fragmento 'activePageValue' con su identificador.
        -->
    </div>

    <!-- ════ CONTENIDO PRINCIPAL ════ -->
    <main class="container py-4 flex-grow-1">

        <!-- Flash messages globales (disponibles en cualquier página hija) -->
        <div th:if="${exito}" class="alert-exito mb-3">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${exito}"></span>
        </div>
        <div th:if="${error}" class="alert-error mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- SLOT: contenido específico de cada página -->
        <div layout:fragment="content"></div>

    </main>

    <!-- ════ FOOTER (fragmento compartido) ════ -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Scripts base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Validación Bootstrap reutilizable -->
    <script>
        (() => {
            'use strict';
            document.querySelectorAll('.needs-validation').forEach(form => {
                form.addEventListener('submit', e => {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });
        })();
    </script>

    <!-- SLOT: scripts adicionales por página (Leaflet, lógica de modales, etc.) -->
<th:block layout:fragment="scripts-extra"></th:block>

</body>
</html>
